[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vt-guard"
version = "0.1.0"
description = "VT-Guard telemetry normalization and data-quality tooling"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vtguard = "vtguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

